<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="A terminal session: run-local.sh starts the server on port 3100, a curl posts an enquiry, and the response is ok true, replied false, recorded true.">
<title>Clone it, run it, send it an enquiry</title>
<defs><clipPath id="win"><rect x="86" y="72" width="1028" height="200"/></clipPath></defs>
<style>
  /* Each line is typed by sliding a background-coloured cover off it.
     The cover's RESTING position is clear of the text — the animation is what
     puts it back over the line — so a renderer that ignores this stylesheet
     shows the whole session rather than three blank rows. The resting position
     is a transform ATTRIBUTE, not just this rule, so it survives a stylesheet
     that never loads at all. Getting that
     backwards is what made the first version of this file useless.
     Covers are clipped to the window; the first version slid them straight
     out across the page. */
  .cover { transform: translateX(1000px); animation: type 9s cubic-bezier(.85,0,.9,1) infinite; }
  @keyframes type { 0% { transform: translateX(0) } 22%,100% { transform: translateX(1000px) } }
  .l2 { animation-delay: .9s }
  .l3 { animation-delay: 1.15s }
  .caret { animation: blink 1.06s steps(2, start) infinite; }
  @keyframes blink { 0%,50% { opacity: 1 } 50.01%,100% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) {
    .cover { animation: none; transform: translateX(1000px) }
    .caret { animation: none }
  }
</style>
<rect width="1200" height="290" fill="#F7F7F5"/>
<rect x="84" y="16" width="1032" height="258" rx="14" fill="#FFFFFF" stroke="#E7E7E4" stroke-width="2"/>
<circle cx="112" cy="46" r="6" fill="#E7E7E4"/><circle cx="132" cy="46" r="6" fill="#E7E7E4"/><circle cx="152" cy="46" r="6" fill="#E7E7E4"/>
<text x="176" y="51" font-size="13" fill="#5A5A57">bash — lazyscale</text>
<line x1="84" y1="70" x2="1116" y2="70" stroke="#E7E7E4" stroke-width="2"/>

<g font-size="14.5" clip-path="url(#win)">
  <text x="112" y="104" fill="#B7F34A">$</text>
  <text x="132" y="104" fill="#111111">./run-local.sh</text>
  <rect class="cover l1" transform="translate(1000 0)" x="129" y="88" width="990" height="22" fill="#FFFFFF"/>

  <text x="112" y="132" fill="#5A5A57">→ http://localhost:3100</text>

  <text x="112" y="176" fill="#B7F34A">$</text>
  <text x="132" y="176" fill="#111111">curl -X POST "localhost:3100/api/inbound?k=demo"</text>
  <text x="152" y="200" fill="#111111">-d '{"name":"Priya","message":"30 chairs by Friday?"}'</text>
  <rect class="cover l2" transform="translate(1000 0)" x="129" y="160" width="990" height="22" fill="#FFFFFF"/>
  <rect class="cover l3" transform="translate(1000 0)" x="129" y="184" width="990" height="22" fill="#FFFFFF"/>

  <text x="112" y="240" fill="#5A5A57">{"ok":true,"replied":false,"recorded":<tspan fill="#B7F34A" font-weight="700">true</tspan>}</text>
  <rect class="caret" x="112" y="256" width="9" height="16" fill="#111111" opacity="0.75"/>
</g>
</svg>
