<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="Inter, -apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, Helvetica, Arial, sans-serif" role="img" aria-label="LazyScale — stop doing work a machine can do. Every enquiry answered in under a minute.">
<title>LazyScale — every enquiry answered in under a minute</title>
<defs>
  <radialGradient id="g" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#B7F34A" stop-opacity="0.20"/>
    <stop offset="70%" stop-color="#B7F34A" stop-opacity="0"/>
  </radialGradient>
</defs>

<style>
  /* Nothing here animates a word out of existence. Every element is readable at
     every frame of the loop; the motion is carried by decoration only. An
     animated SVG in a README can be paused, sampled for a preview, or rendered
     by something that does not animate at all, and all three must look right. */

  .rule { animation: sweep 7s cubic-bezier(.2,.7,.3,1) infinite; transform-origin: 84px 278px; }
  @keyframes sweep { 0% { transform: scaleX(.16) } 26%,100% { transform: scaleX(1) } }

  /* the reply lands — a nudge, not an entrance */
  .out { animation: land 7s cubic-bezier(.2,.8,.3,1) infinite; transform-origin: 945px 245px; }
  @keyframes land { 0%,46% { transform: translateX(0) scale(1) } 54% { transform: translateX(0) scale(1.035) } 62%,100% { transform: translateX(0) scale(1) } }

  .inb { animation: arrive 7s cubic-bezier(.2,.8,.3,1) infinite; transform-origin: 915px 129px; }
  @keyframes arrive { 0% { transform: scale(1) } 6% { transform: scale(1.03) } 14%,100% { transform: scale(1) } }

  /* the only thing that may vanish, because it says nothing */
  .dot { opacity: .25; animation: blink 7s ease-in-out infinite; }
  @keyframes blink { 0%,20% { opacity: .25 } 26% { opacity: 1 } 40% { opacity: .25 } 100% { opacity: .25 } }
  .d2 { animation-delay: .16s } .d3 { animation-delay: .32s }

  .stamp { animation: tick 7s ease-out infinite; transform-origin: 898px 314px; }
  @keyframes tick { 0%,62% { transform: scale(1) } 70% { transform: scale(1.05) } 80%,100% { transform: scale(1) } }

  .glow { animation: drift 14s ease-in-out infinite; transform-origin: 1010px 40px; }
  @keyframes drift { 0%,100% { transform: scale(1) } 50% { transform: scale(1.12) } }

  @media (prefers-reduced-motion: reduce) {
    .rule, .out, .inb, .stamp, .glow { animation: none; transform: none }
    .dot { animation: none; opacity: .25 }
  }
</style>

<rect width="1200" height="400" fill="#F7F7F5"/>
<circle class="glow" cx="1010" cy="40" r="300" fill="url(#g)"/>

<!-- mark + name -->
<g>
  <g transform="translate(84,44) scale(1.0833)">
    <rect x="2.5" y="2.5" width="43" height="43" rx="13" fill="#B7F34A" stroke="#111111" stroke-width="2.6"/>
    <g transform="translate(-1.6,0)" fill="none" stroke="#111111" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 13.2 V29.6 a4.6 4.6 0 0 0 4.6 4.6 h1.2"/>
      <path d="M35.4 19.4 C35.4 16 32.9 13.9 29.9 13.9 C26.9 13.9 24.6 15.8 24.6 18.3 C24.6 23.9 35.8 22.2 35.8 28.6 C35.8 31.9 33.1 34.4 29.9 34.4 C26.7 34.4 24.2 32.4 24.2 29.3"/>
    </g>
  </g>
  <text class="f" x="152" y="80" font-size="30" font-weight="700" letter-spacing="-0.8" fill="#111111">LazyScale</text>
</g>

<!-- headline, wiped in line by line -->
<g><text class="f" x="84" y="200" font-size="52" font-weight="700" letter-spacing="-1.8" fill="#111111">Stop doing work</text></g>
<g><text class="f" x="84" y="262" font-size="52" font-weight="700" letter-spacing="-1.8" fill="#111111">a machine can do.</text></g>
<rect class="rule" x="84" y="276" width="500" height="5" rx="2.5" fill="#B7F34A"/>

<text class="f" x="84" y="320" font-size="18" fill="#5A5A57">Every enquiry answered in under a minute — WhatsApp, Instagram, email and the web.</text>

<g class="f" font-size="13" fill="#5A5A57">
  <g><rect x="84" y="344" width="196" height="30" rx="15" fill="none" stroke="#E7E7E4"/><text x="102" y="364">Static HTML, no build step</text></g>
  <g><rect x="290" y="344" width="158" height="30" rx="15" fill="none" stroke="#E7E7E4"/><text x="308" y="364">Serverless on Vercel</text></g>
  <g><rect x="458" y="344" width="160" height="30" rx="15" fill="none" stroke="#E7E7E4"/><text x="476" y="364">Capture before spend</text></g>
</g>

<!-- the scene -->
<g class="f" font-size="14">
  <g class="inb">
    <rect x="770" y="96" width="290" height="66" rx="16" fill="#EFEFEC"/>
    <text x="792" y="124" fill="#111111" font-size="14">Do you deliver to Indiranagar?</text>
    <text x="792" y="146" fill="#5A5A57" font-size="13">11:41 pm</text>
  </g>

  <g fill="#5A5A57">
    <circle class="dot" cx="794" cy="190" r="5"/>
    <circle class="dot d2" cx="812" cy="190" r="5"/>
    <circle class="dot d3" cx="830" cy="190" r="5"/>
  </g>

  <g class="out">
    <rect x="800" y="212" width="290" height="66" rx="16" fill="#B7F34A"/>
    <text x="822" y="240" fill="#111111" font-size="14">Yes — same day to Indiranagar.</text>
    <text x="822" y="262" fill="#111111" font-size="13" opacity="0.72">11:41 pm</text>
  </g>

  <g class="stamp">
    <rect x="800" y="296" width="196" height="36" rx="18" fill="none" stroke="#B7F34A" stroke-width="2"/>
    <path d="M822 314 l7 7 l13 -14" fill="none" stroke="#B7F34A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="852" y="319" fill="#111111" font-size="14" font-weight="500">answered in 41s</text>
  </g>
</g>
</svg>
